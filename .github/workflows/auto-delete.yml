name: Auto Delete Expired Tokens
on:
  schedule:
    - cron: '0 * * * *' # Berjalan otomatis setiap 1 jam
  workflow_dispatch: # Memungkinkan Anda menjalankan manual jika ingin

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Run Cleanup Script
        run: |
          node -e "
          const fs = require('fs');
          const path = 'token.json';
          if (fs.existsSync(path)) {
            const data = JSON.parse(fs.readFileSync(path, 'utf8'));
            const now = new Date();
            const active = data.filter(t => new Date(t.expired) > now);
            if (data.length !== active.length) {
              fs.writeFileSync(path, JSON.stringify(active, null, 2));
              console.log('Expired tokens removed');
            } else {
              console.log('No expired tokens found');
            }
          }
          "

      - name: Commit and Push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add token.json
          git commit -m "System: Auto-delete expired tokens (Cron)" || exit 0
          git push
